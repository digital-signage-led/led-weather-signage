<!DOCTYPE html>
<html lang="ja" class="is-kiosk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>天気予報サイネージ</title>
  <style>
    html.is-boot { background: #c8ebff; }
    html.is-boot .led-screen { visibility: visible; }
    html, body { margin: 0; width: 100%; height: 100%; background: #c8ebff; overflow: hidden; }
    #led-screen {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      transform-origin: 0 0;
      background: #c8ebff;
      --card-scale: 0.748052;
      --title-scale: 1.3;
      --header-title-height: 87px;
      --header-height: 60px;
      --footer-height: 150px;
      --footer-gap: 42px;
      --box-radius: 8px;
      --card-box-w: 200px;
      --card-box-h: 260px;
    }
    #boot-status {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      margin: 0;
      background: #c8ebff;
      color: #0a2f7a;
      font: 700 28px/1.4 "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      letter-spacing: 0.06em;
    }
    html.is-boot #boot-status { display: none; }
    /* 外部CSS未読込時の最低限フォールバック（本定義は weather.css） */
    .forecast-grid {
      display: grid;
      grid-template-columns: var(--city-col-width, 14%) repeat(7, minmax(0, 1fr));
      grid-template-rows: var(--day-head-height, auto) repeat(var(--forecast-rows, 5), minmax(0, 1fr));
      gap: var(--forecast-gap, 2px);
      min-width: 0;
      min-height: 0;
    }
    .wx-icon svg,
    svg.jma-icon,
    .led-title-mark svg {
      max-width: 100%;
      max-height: 100%;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=pref528">
  <link rel="stylesheet" href="css/weather.css?v=pref530">
  <link rel="modulepreload" href="js/app.js?v=pref530">
  <link rel="modulepreload" href="js/area-master.js?v=pref528">
  <link rel="preload" href="data/weather.json?v=pref522" as="fetch" crossorigin>
  <link rel="preload" href="data/locations.json?v=pref522" as="fetch" crossorigin>
  <link rel="preload" href="maps/japan.svg?v=pref507" as="fetch" crossorigin>
  <script>
    (function () {
      try { document.documentElement.classList.remove("is-boot"); } catch (e) { /* ignore */ }
      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        });
      }
      if (window.caches) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) { caches.delete(key); });
        });
      }
    })();
  </script>
</head>
<body class="is-kiosk">
  <p id="boot-status" role="status">読込中</p>
  <div id="studio-root" hidden>
    <form class="studio-bar" id="studio-bar">
      <label>
        地域
        <select id="region-select" name="region"></select>
      </label>
      <label>
        コンテンツ
        <select id="content-select" name="content"></select>
      </label>
      <label>
        幅
        <input id="viewport-width" name="vw" type="number" min="160" max="7680" step="1" value="1920">
      </label>
      <label>
        高さ
        <input id="viewport-height" name="vh" type="number" min="120" max="4320" step="1" value="1080">
      </label>
      <div class="studio-presets" id="viewport-presets" aria-label="確認用サイズ"></div>
      <div id="studio-map-tools" class="studio-map-tools">
        <label>
          タイトル大きさ <span id="title-scale-value">1.00</span>
          <input id="title-scale" type="range" min="0.6" max="2.8" step="0.02" value="1">
        </label>
        <label>
          列島 拡大 <span id="map-scale-value">1.00</span>
          <input id="map-scale" type="range" min="0.4" max="3.6" step="0.02" value="1">
        </label>
        <label>
          列島 回転 <span id="map-rotate-value">0°</span>
          <input id="map-rotate" type="range" min="-40" max="40" step="1" value="0">
        </label>
        <label>
          列島 左右
          <input id="map-x" type="range" min="-48" max="48" step="0.5" value="0">
        </label>
        <label>
          列島 上下
          <input id="map-y" type="range" min="-48" max="48" step="0.5" value="0">
        </label>
        <label>
          ボックス大きさ <span id="card-scale-value">1.00</span>
          <span id="card-size-px">—</span>
          <input id="card-scale" type="range" min="0.28" max="3" step="0.02" value="1">
        </label>
        <label>
          ボックス幅
          <input id="card-width-px" name="cardw" type="number" min="28" max="720" step="1" value="160">
        </label>
        <button type="button" id="layout-commit">配置を固定</button>
        <button type="button" id="layout-undo">配置を戻す</button>
        <button type="button" id="layout-reset">確定配置へ戻す</button>
      </div>
      <div id="card-tools" class="studio-card-tools" hidden>
        <span class="studio-card-heading">ボックス位置 左右％ / 上下％</span>
        <div id="card-editors"></div>
      </div>
      <p class="studio-hint">管理画面が親です。ここで地図やボックスを動かすと、その地域の今日／明日の天気・降水が全部同じになります。「配置を固定」で保存、「配置を戻す」で直前の操作に戻れます。「確定配置へ戻す」は同梱の確定位置です。</p>
      <div class="studio-metrics" id="preview-metrics"></div>
    </form>
    <div id="preview-stage">
      <div class="signage-slot" id="signage-slot">
        <iframe id="signage-frame" title="本番画面" scrolling="no"></iframe>
      </div>
    </div>
  </div>

  <div id="app">
    <article class="led-screen" id="led-screen">
      <header class="led-header">
        <div class="led-title-stack">
          <div class="led-title-bar">
            <span class="led-title-mark" aria-hidden="true">
              <svg viewBox="-6 -6 76 76" xmlns="http://www.w3.org/2000/svg">
                <circle cx="32" cy="32" r="12" fill="currentColor"/>
                <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
                  <path d="M32 6v8M32 50v8M6 32h8M50 32h8M12 12l6 6M46 46l6 6M12 52l6-6M46 18l6-6"/>
                </g>
              </svg>
            </span>
            <h1 class="led-title" id="led-title">全国｜今日の天気</h1>
          </div>
          <div class="led-title-bar led-sub-bar">
            <div class="led-stamp" id="led-stamp">9月16日(水) 18:00更新</div>
          </div>
        </div>
      </header>
      <div class="led-body">
        <div class="map-stage" id="map-stage"></div>
      </div>
      <div class="map-attribution" id="map-attribution"></div>
      <footer class="led-footer">
        <div class="led-note-bar">
          <span class="led-note-mark" aria-hidden="true">
            <span class="led-note-icon-box">
              <span class="wx-icon" id="led-note-icon"></span>
            </span>
          </span>
          <div class="led-note" id="led-note"></div>
          <p class="jma-credit">出典：<a href="https://www.jma.go.jp/bosai/forecast/">気象庁</a>（jma.go.jp）</p>
        </div>
      </footer>
    </article>
    <aside id="debug-overlay" hidden></aside>
  </div>
  <script>
    (function () {
      var screen = document.getElementById("led-screen");
      if (!screen) return;
      var params = new URLSearchParams(window.location.search);
      if (Number(params.get("vw")) > 0 && Number(params.get("vh")) > 0) return;
      function fit() {
        var w = window.innerWidth || 1920;
        var h = window.innerHeight || 1080;
        var scale = Math.min(w / 1920, h / 1080);
        var ox = (w - 1920 * scale) / 2;
        var oy = (h - 1080 * scale) / 2;
        screen.style.position = "absolute";
        screen.style.left = "0";
        screen.style.top = "0";
        screen.style.width = "1920px";
        screen.style.height = "1080px";
        screen.style.transformOrigin = "0 0";
        screen.style.transform = "translate(" + ox + "px," + oy + "px) scale(" + scale + ")";
      }
      fit();
      window.addEventListener("resize", fit);
    })();
  </script>
  <script type="module" src="js/app.js?v=pref530"></script>
</body>
</html>
