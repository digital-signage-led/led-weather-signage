<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED Studio</title>
  <script>
    (function () {
      var path = location.pathname.replace(/[^/]+$/, "");
      if (!path.endsWith("/")) path += "/";
      location.replace(path + "?studio=1");
    })();
  </script>
</head>
<body>
  <p>管理画面を開いています…</p>
  <p><a href="./?studio=1">開かない場合はこちら</a></p>
</body>
</html>
