<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>気象庁公式天気アイコン一覧</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
      background: #071018;
      color: #e8eef5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 18px 22px;
      background: #0b1622;
      border-bottom: 1px solid #243445;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    .notice,
    #summary {
      margin: 0 0 12px;
      font-size: 12px;
      color: #9db0c2;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    input,
    select {
      height: 36px;
      padding: 0 12px;
      border: 1px solid #35506a;
      border-radius: 6px;
      background: #102033;
      color: #fff;
    }
    input { width: min(420px, 100%); }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      padding: 18px;
    }
    .card {
      padding: 12px;
      border: 1px solid #243445;
      border-radius: 8px;
      background: #101c28;
    }
    .meta { display: grid; gap: 2px; font-size: 13px; margin-bottom: 10px; }
    .status.ok { color: #7dffa3; }
    .status.ng { color: #ff8a8a; }
    .views { display: flex; gap: 12px; align-items: end; }
    figure { margin: 0; }
    figcaption { font-size: 11px; color: #9db0c2; margin-bottom: 6px; }
    .weather-icon-frame {
      width: 128px;
      height: 128px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000000;
    }
    .weather-icon {
      width: 116px;
      height: 116px;
      object-fit: contain;
    }
    .native-icon { max-width: 80px; max-height: 60px; object-fit: contain; }
    .missing { color: #ff8a8a; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>気象庁公式天気アイコン 118種</h1>
    <p class="notice">出典：気象庁ホームページ https://www.jma.go.jp/　／　公式SVGをローカル保存。形・色は加工していません。</p>
    <p id="summary"></p>
    <div class="toolbar">
    <input id="q" type="search" placeholder="天気コードまたは名称で検索">
      <select id="filter" aria-label="取得結果で絞り込み">
        <option value="all">すべて</option>
        <option value="ok">取得成功</option>
        <option value="ng">取得失敗</option>
      </select>
  </div>
  </header>
  <main id="list"></main>
  <script type="module" src="./catalog.js"></script>
</body>
</html>
